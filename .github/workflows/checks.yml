name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.14"
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        shell: python
        run: |
          from pathlib import Path

          sources = [Path("main.py")]
          for directory in ("adapters", "launcher", "skills/Common/scripts", "skills/Mathematics_Competition/scripts"):
              sources.extend(sorted(Path(directory).rglob("*.py")))
          for path in sources:
              compile(path.read_text(encoding="utf-8-sig"), str(path), "exec")
          print(f"Checked {len(sources)} Python files.")
      - name: Check command-line entry points without AI calls
        shell: python
        run: |
          import subprocess
          import sys

          scripts = (
              "adapters/run.py",
              "adapters/pdf_export.py",
              "skills/Common/scripts/extract_pdf.py",
              "skills/Common/scripts/compile_latex.py",
              "skills/Common/scripts/check_practice.py",
              "skills/Mathematics_Competition/scripts/scrape_cmathc.py",
          )
          for script in scripts:
              result = subprocess.run(
                  [sys.executable, "-B", script, "--help"],
                  capture_output=True, text=True, encoding="utf-8", timeout=30,
              )
              if result.returncode:
                  sys.exit(f"{script}:\n{result.stdout}\n{result.stderr}")
              print(f"OK: {script} --help")

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
